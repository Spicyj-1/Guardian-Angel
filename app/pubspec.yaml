name: guardian_angel
description: Guardian Angel — offline-first seizure detection companion (Phase 2 shell).
publish_to: "none"
version: 0.2.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  flutter_local_notifications: ^17.0.0
  geolocator: ^12.0.0
  local_auth: ^2.1.0
  flutter_secure_storage: ^9.0.0
  fl_chart: ^0.68.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  sensors_plus: ^7.1.1
  tflite_flutter: ^0.11.0
  # NOTE: tflite_flutter added in Phase 3 (needs select_tf_ops for LSTM).
  # Model binary lives in ../model/seizure_detection_model.tflite (250x6 in, 1 out).

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.0
  build_runner: ^2.4.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
