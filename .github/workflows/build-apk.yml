name: build-apk
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch: {}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android shell + debug APK
        working-directory: app
        run: |
          flutter create --platforms=android --org com.promivine --project-name guardian_angel .
          cat >> android/build.gradle.kts <<'EOF'

          // Unify JVM targets (tflite_flutter pins old defaults; runner uses Java 17).
          // afterEvaluate: our values must win over the plugin's own script.
          subprojects {
            afterEvaluate {
              tasks.withType<org.gradle.api.tasks.compile.JavaCompile>().configureEach {
                sourceCompatibility = "17"
                targetCompatibility = "17"
              }
              tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                kotlinOptions.jvmTarget = "17"
              }
            }
          }
          EOF
          flutter pub get
          echo '--- tflite_flutter build.gradle BEFORE ---'
          TFLITE_GRADLE=$(find ~/.pub-cache/hosted/pub.dev -maxdepth 1 -name 'tflite_flutter-*' -type d | head -1)/android/build.gradle
          grep -n -i 'compatib\|jvmTarget\|JavaVersion' "$TFLITE_GRADLE" || true
          sed -i 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g; s/jvmTarget = .1\.8./jvmTarget = "17"/g; s/jvmTarget=.1\.8./jvmTarget = "17"/g' "$TFLITE_GRADLE"
          echo '--- tflite_flutter build.gradle AFTER ---'
          grep -n -i 'compatib\|jvmTarget\|JavaVersion' "$TFLITE_GRADLE" || true
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: guardian-angel-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
