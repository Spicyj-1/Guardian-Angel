name: build-apk
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch: {}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android shell + debug APK
        working-directory: app
        run: |
          flutter create --platforms=android --org com.promivine --project-name guardian_angel .
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/jvm-fix.gradle <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile
          // Fires for every project in every build (incl. Flutter plugin
          // included-builds, which root subprojects{} cannot reach).
          gradle.beforeProject { project ->
            project.afterEvaluate {
              project.tasks.withType(JavaCompile).configureEach {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
              }
              project.tasks.configureEach { t ->
                if (t.name.startsWith('compile') && t.name.contains('Kotlin')) {
                  t.kotlinOptions.jvmTarget = '17'
                }
              }
            }
          }
          EOF
          flutter pub get
          echo '--- resolving tflite version ---'
          TFLITE_DIR=$(find ~/.pub-cache/hosted/pub.dev -maxdepth 1 -name 'tflite_flutter-*' -type d | head -1)
          basename "$TFLITE_DIR"
          TFLITE_GRADLE="$TFLITE_DIR/android/build.gradle"
          grep -n -i 'compatib\|jvmTarget\|kotlin' "$TFLITE_GRADLE" || true
          sed -i 's/JavaVersion\.VERSION_11/JavaVersion.VERSION_17/g' "$TFLITE_GRADLE"
          echo '--- after patch ---'
          grep -n -i 'compatib\|jvmTarget\|kotlin' "$TFLITE_GRADLE" || true
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: guardian-angel-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
