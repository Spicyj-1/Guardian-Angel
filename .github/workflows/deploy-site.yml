name: deploy-site
on:
  push:
    branches: [main]
    paths: ["app/**", "prototype/**", "design-preview.html", "netlify-drop/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: app
      - run: flutter build web --release --no-tree-shake-icons --base-href /Guardian-Angel/app/
        working-directory: app
      - name: Assemble site (Flutter app + existing demos, links preserved)
        run: |
          rm -rf site && mkdir -p site/app site/prototype
          cp -r app/build/web/* site/app/
          cp prototype/index.html site/prototype/index.html
          cp design-preview.html site/design-preview.html
          cp netlify-drop/index.html site/netlify-index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
