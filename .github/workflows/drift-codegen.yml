name: drift-codegen
on:
  push:
    branches: [main]
    paths: ["app/lib/data/**", ".github/workflows/drift-codegen.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  codegen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Commit generated code
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add lib/data/db.g.dart || true
          git diff --cached --quiet || git commit -m "Drift codegen: db.g.dart"
          git push || true
